<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMN Kiosk</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated}
</style>
</head>
<body>
<canvas id="board"></canvas>
<script>
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
let last='';
let boardWidth=0;
let boardHeight=0;

function fitCanvas(){
    if(boardWidth<=0||boardHeight<=0)return;

    const scale=Math.min(
        window.innerWidth/boardWidth,
        window.innerHeight/boardHeight
    );

    canvas.style.width=`${boardWidth*scale}px`;
    canvas.style.height=`${boardHeight*scale}px`;
}

function render(board){
    const {width,height,colors,data}=board;
    if(!Number.isInteger(width)||!Number.isInteger(height)||!Array.isArray(colors)||!Array.isArray(data))return;

    boardWidth=width;
    boardHeight=height;
    canvas.width=width;
    canvas.height=height;
    fitCanvas();

    ctx.clearRect(0,0,width,height);
    for(let i=0;i<Math.min(data.length,width*height);i++){
        const id=data[i];
        if(id===0)continue;
        const color=colors[id-1];
        if(!color)continue;
        ctx.fillStyle=color;
        ctx.fillRect(i%width,Math.floor(i/width),1,1);
    }
}

async function refresh(){
    try{
        const r=await fetch('/board/get',{cache:'no-store'});
        if(!r.ok)return;
        const t=await r.text();
        if(t===last)return;
        last=t;
        render(JSON.parse(t));
    }catch(_){}
}

window.addEventListener('resize',fitCanvas);
refresh();
setInterval(refresh,1000);
</script>
</body>
</html>
